# --- Escopo ---
sonar.sources=src,next.config.ts
sonar.tests=src/__tests__

# Garante que o Sonar classifique seus testes corretamente
sonar.test.inclusions=src/__tests__/**/*.test.ts,src/__tests__/**/*.test.tsx

# Evita que testes sejam tratados como código de produção (sources)
sonar.exclusions=src/__tests__/**

# --- Coverage (Vitest) ---
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Duplicação (CPD) ---
# i18n, arquivos de dados bilíngues e suítes de testes são excluídos da análise de duplicação
sonar.cpd.exclusions=src/i18n/**,src/locales/**,public/locales/**,**/i18n/**,**/locales/**,src/data/**,src/data/skills/en.ts,src/data/skills/pt.ts,src/data/experiences/en.ts,src/data/experiences/pt.ts,src/__tests__/**

# --- Coverage exclusions ---
# não faz sentido "cobrir" arquivos de tradução/dados e camada App Router já excluída no Vitest
sonar.coverage.exclusions=src/app/**,src/i18n/**,src/locales/**,public/locales/**,**/i18n/**,**/locales/**,src/**/data/**,src/**/constants/**
